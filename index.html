<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♟️ Chess Competition Registration</title>
      <!--<link rel="stylesheet" href="style.css">-->

    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 550px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: slideUp 0.6s ease-out;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 30px;
}

.chess-icon {
    font-size: 50px;
    margin-bottom: 5px;
}

.header h1 {
    font-size: 32px;
    color: #1a1a2e;
    margin-bottom: 5px;
}

.header h1 span {
    background: linear-gradient(135deg, #f5a623, #f7c948);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.subtitle {
    color: #666;
    font-size: 14px;
    letter-spacing: 1px;
}

/* Form */
.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    color: #1a1a2e;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 14px;
}

input, select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    transition: all 0.3s ease;
    background: #f8f9fa;
}

input:focus, select:focus {
    outline: none;
    border-color: #f5a623;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.1);
}

input::placeholder {
    color: #aaa;
}

.hint {
    font-size: 12px;
    color: #f5a623;
    margin-top: 5px;
}

/* Error Messages */
.error-message {
    color: #e74c3c;
    font-size: 12px;
    margin-top: 5px;
    display: none;
}

.error-message.show {
    display: block;
    animation: shake 0.3s ease;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}

.input-error {
    border-color: #e74c3c !important;
    background: #fff5f5 !important;
}

.input-success {
    border-color: #2ecc71 !important;
    background: #f0faf4 !important;
}

/* Submit Button */
.btn-register {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #f5a623, #f7c948);
    color: #1a1a2e;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.btn-register:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(245, 166, 35, 0.3);
}

.btn-register:active {
    transform: translateY(0);
}

.btn-register .btn-icon {
    font-size: 20px;
}

/* Message */
.message {
    margin-top: 20px;
    padding: 15px 20px;
    border-radius: 10px;
    font-weight: 500;
    display: none;
    animation: slideUp 0.3s ease;
}

.message.success {
    display: block;
    background: #d4edda;
    color: #155724;
    border: 2px solid #c3e6cb;
}

.message.error {
    display: block;
    background: #f8d7da;
    color: #721c24;
    border: 2px solid #f5c6cb;
}

.message.info {
    display: block;
    background: #d1ecf1;
    color: #0c5460;
    border: 2px solid #bee5eb;
}

/* Footer */
.footer {
    margin-top: 30px;
    text-align: center;
    color: #999;
    font-size: 12px;
}

.footer-links {
    margin-top: 5px;
}

.footer-links a {
    color: #f5a623;
    text-decoration: none;
    transition: color 0.3s;
}

.footer-links a:hover {
    color: #e0960a;
    text-decoration: underline;
}

/* Responsive */
@media (max-width: 600px) {
    .container {
        padding: 25px;
        margin: 10px;
    }
    
    .header h1 {
        font-size: 24px;
    }
    
    .chess-icon {
        font-size: 40px;
    }
    
    input, select {
        font-size: 14px;
        padding: 10px 12px;
    }
}
</style>

</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="chess-icon">♟️</div>
            <h1>Chess <span>Championship</span></h1>
            <p class="subtitle">2026 Open Tournament • 18+ Only</p>
        </div>

        <!-- Registration Form -->
        <form id="registrationForm">
            <div class="form-group">
                <label for="fullname">👤 Full Name</label>
                <input type="text" id="fullname" name="fullname" 
                       placeholder="Enter your full name" required>
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">📧 Email Address</label>
                <input type="email" id="email" name="email" 
                       placeholder="Enter your email address" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="age">🎂 Age</label>
                <input type="number" id="age" name="age" 
                       placeholder="Must be 18 or older" 
                       min="18" max="120" required>
                <div class="hint">⚠️ You must be at least 18 years old to participate</div>
                <div class="error-message" id="ageError"></div>
            </div>

            <div class="form-group">
                <label for="chess_rating">♟️ Chess Rating (Optional)</label>
                <input type="number" id="chess_rating" name="chess_rating" 
                       placeholder="Enter your chess rating (e.g., 1500)" 
                       min="0" max="3000">
            </div>

            <div class="form-group">
                <label for="experience">📊 Experience Level</label>
                <select id="experience" name="experience">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                    <option value="expert">Expert</option>
                </select>
            </div>

            <button type="submit" class="btn-register">
                <span>Register Now</span>
                <span class="btn-icon">♟️</span>
            </button>
        </form>

        <!-- Message Display -->
        <div id="message" class="message" style="display: none;"></div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2026 Chess Championship | All rights reserved</p>
            <p class="footer-links">
                <a href="admin.php">Admin Dashboard</a> • 
                <a href="#" onclick="viewParticipants()">View Participants</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
